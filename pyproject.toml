[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling >= 1.26",
]

[project]
dependencies = [
    "APScheduler==3.11.3",
    "aiowebostv==0.10.0",
    "broadlink==0.19.0",
    "cryptography==50.0.1",
    "Flask==3.1.3",
    "SQLAlchemy==2.0.51",
    "skyfield==1.55",
    "gunicorn==26.2.0",
    "icalendar==7.3.0",
    "scapy==2.7.0",
    "orc_data==0.0.1",
    "piper-tts==1.7.0",
    "pychromecast==14.0.10",
    "paho-mqtt==2.1.0",
    "Pillow==12.3.0",
    "audioop-lts==0.2.2; python_version >= '3.13'",
    "pyaudio==0.2.14",
    "pyalsaaudio==0.11.0; sys_platform == 'linux'",
    "recurring-ical-events==3.8.2",
    "requests==2.34.2",
    "yt-dlp==2026.8.19",
    "command-cfg==0.6.0",
]
name = "orc"
version = "0.0.1"
requires-python = ">=3.14,<3.15"

[project.optional-dependencies]
test = [
    "freezegun==1.5.5",
    "pytest==9.1.1",
]
lint = [
    "mypy==2.3.1",
    "ruff==0.16.5",
]

[project.scripts]
orc = "orc.runner:web"
orc-audio-devices = "orc.dal.audio.pyaudio:list_devices_cli"

[tool.ruff]
line-length = 140
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["apscheduler"]

[tool.mypy]
python_version = "3.14"
files = ["src/orc", "extras/src/orc_extras"]
mypy_path = ["extras/src"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = [ "src", "data/src", "extras/src" ]
testpaths = [ "tests" ]

[tool.hatch.build.targets.wheel]
packages = ["src/orc"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/hatch_build.py"

[tool.uv.sources]
orc_data = { path = "data" }
command-cfg = { git = "https://github.com/exussum/command-cfg", tag = "v0.6.0" }


