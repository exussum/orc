default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      - id: opengrep
        name: opengrep
        entry: opengrep scan
        language: system
        args: ["--config", "auto", "--error", "--skip-unknown-extensions"]
        require_serial: true
        exclude: '^src/orc/static/vendor/'

      - id: node-check
        name: node --check
        entry: bash -c 'for f in "$@"; do node --check "$f"; done' --
        language: system
        files: \.js$
        exclude: '^src/orc/static/vendor/'

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.6.1
    hooks:
      - id: betterleaks

  - repo: local
    hooks:
      - id: protect-sample-config
        name: sample config staged
        entry: bash -c 'git diff --cached --quiet -- src/config.orc || { echo "sample config — commit with SKIP=protect-sample-config"; exit 1; }'
        language: system
        files: ^src/config\.orc$
        pass_filenames: false

      - id: tailwind
        name: tailwind
        entry: tailwindcss -i src/css/tailwind.src.css -o src/orc/static/tailwind.min.css --minify
        language: system
        pass_filenames: false
        files: ^(src/css/tailwind\.src\.css|src/orc/templates/.*\.html|src/orc/static/.*\.(js|svg))$

      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: pylock
        name: pylock
        entry: uv export --frozen --format pylock.toml -o pylock.toml
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|pylock\.toml)$

      - id: pip-audit
        name: pip-audit
        entry: pip-audit --locked .
        language: system
        pass_filenames: false
        files: ^pylock\.toml$

      - id: mypy
        name: mypy
        entry: uv run --extra lint mypy
        language: system
        pass_filenames: false
        files: \.py$

      - id: pytest
        name: pytest
        entry: sh -c 'uv run --extra test pytest && uv run --extra test pytest extras'
        language: system
        pass_filenames: false
        files: \.py$
