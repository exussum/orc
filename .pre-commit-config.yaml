default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 8.0.1
    hooks:
      - id: isort

  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies: [Flake8-pyproject]

  - repo: local
    hooks:
      - id: opengrep
        name: opengrep
        entry: opengrep scan
        language: system
        args: ["--config", "auto", "--error", "--skip-unknown-extensions"]
        require_serial: true

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.6.1
    hooks:
      - id: betterleaks

  - repo: local
    hooks:
      - id: tailwind
        name: tailwind
        entry: tailwindcss -i src/css/tailwind.src.css -o src/orc/static/tailwind.min.css --minify
        language: system
        pass_filenames: false
        files: ^(src/css/tailwind\.src\.css|src/orc/templates/.*\.html|src/orc/static/.*\.(js|svg))$

      - id: uv-lock
        name: uv-lock
        entry: uv lock
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: pylock
        name: pylock
        entry: uv export --frozen --format pylock.toml -o pylock.toml
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|pylock\.toml)$

      - id: pip-audit
        name: pip-audit
        entry: pip-audit --locked .
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run --extra lint mypy
        language: system
        pass_filenames: false
        files: \.py$

      - id: pytest
        name: pytest
        entry: sh -c 'uv run --extra test pytest && uv run --extra test pytest plugins'
        language: system
        pass_filenames: false
        files: \.py$
