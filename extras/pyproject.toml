[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling >= 1.26",
]

[project]
name = "orc_extras"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
    "orc==0.0.1",
]

# Flask, cryptography, and paho-mqtt already ship with orc; amqtt is the only extra dep.
[project.optional-dependencies]
lg_ac = [
    "amqtt==0.12.0",
]

[project.scripts]
lg-ac-calibrate = "orc_extras.lg_ac.calibrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orc_extras"]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = [ "src", "../src", "../data/src" ]
testpaths = [ "tests" ]
