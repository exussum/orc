[build-system]
build-backend = "hatchling.build"
requires = [
    "hatchling >= 1.26",
]

[project]
name = "orc_extras"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = [
    "orc==0.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orc_extras"]

[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = [ "src", "../src", "../data/src" ]
testpaths = [ "tests" ]
